<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>生成图标</title></head>
<body>
  <canvas id="c192" width="192" height="192"></canvas>
  <canvas id="c512" width="512" height="512"></canvas>
  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d')
      // 背景
      ctx.fillStyle = '#409eff'
      ctx.beginPath()
      ctx.arc(size/2, size/2, size/2, 0, Math.PI*2)
      ctx.fill()
      // 文字
      ctx.fillStyle = '#fff'
      ctx.font = `bold ${size*0.5}px Arial`
      ctx.textAlign = 'center'
      ctx.textBaseline = 'middle'
      ctx.fillText('🌾', size/2, size/2)
    }
    drawIcon(document.getElementById('c192'), 192)
    drawIcon(document.getElementById('c512'), 512)
    // 自动下载
    setTimeout(() => {
      const a192 = document.createElement('a')
      a192.href = document.getElementById('c192').toDataURL()
      a192.download = 'icon-192.png'
      a192.click()
      const a512 = document.createElement('a')
      a512.href = document.getElementById('c512').toDataURL()
      a512.download = 'icon-512.png'
      a512.click()
    }, 1000)
  </script>
</body>
</html>
